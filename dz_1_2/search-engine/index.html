<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <div class="weather">
      <div class="temp">36°</div>
      <div class="city">Ahmedabad</div>
    </div>

    <main class="main">
      <div class="clock">09:11:01</div>
      <div class="greeting">Good Morning, Saad.</div>

      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="search-placeholder">Search</span>
      </div>

      <div class="icons">
        <div class="icon-btn">
            <span>YT</span>
        </div>

        <div class="icon-btn">
          <span>GPT</span>
        </div>

        <div class="icon-btn">
          <span>DG</span>
        </div>

        <div class="icon-btn">
          <span>DS</span>
        </div>

        <div class="icon-btn">
          <span>GH</span>
        </div>

        <div class="icon-btn">
          <span>In</span>
        </div>

        <div class="icon-btn">
          <span>+</span>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
